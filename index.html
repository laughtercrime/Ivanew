<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=128">
<title>IVAN AI</title>
<style>
  body { margin:0; padding:0; width:128px; height:160px; overflow:hidden;
         background:#000; color:#0f0; font-family:monospace; font-size:9px; }
  #header { height:12px; line-height:12px; text-align:center; background:#020;
            border-bottom:1px solid #0f0; }
  #chat { height:126px; overflow-y:auto; overflow-x:hidden; padding:1px; }
  .q { color:#0f6; margin:1px 0; }
  .a { color:#0d0; margin:1px 0; }
  .img { display:block; width:64px; margin:1px 0; border:1px solid #0f0; }
  #bar { height:20px; border-top:1px solid #0f0; }
  #q { width:94px; height:18px; background:#001a00; color:#0f0; border:0;
       font-family:monospace; font-size:9px; padding:0 2px; }
  #btn { width:30px; height:18px; background:#000; color:#0f0; border:0;
         border-left:1px solid #0f0; font-family:monospace; font-size:9px; }
</style>
</head>
<body>
  <div id="header">IVAN AI</div>
  <div id="chat"></div>
  <div id="bar">
    <input id="q" type="text" placeholder="Ask...">
    <button id="btn" onclick="ask()">GO</button>
  </div>

<script type="text/javascript">
/* ============================================================
   BUILT-IN API KEY - paste your sk_ key here
   ============================================================ */
var API_KEY = "sk_gVmCcHKbxCWvBiGbMwhogZqd447eGjzh";

var SYS = "Your name is Ivan AI, made by Ivan, not ChatGPT. " +
          "Keep answers short: simple sentences, small bullets. " +
          "End with one line: KEYWORDS: w1, w2, w3";

var chat  = document.getElementById('chat');
var input = document.getElementById('q');
var btn   = document.getElementById('btn');
var busy  = false;

function add(cls, text) {
  var d = document.createElement('div');
  d.className = cls;
  d.appendChild(document.createTextNode(text));
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

/* ---- JSON parse that works on old WebViews ---- */
function parseJSON(s) {
  try { return eval('(' + s + ')'); } catch (e) { return null; }
}

/* ---- XHR helper (sync fallback for ancient browsers) ---- */
function xhrGet(url, cb) {
  var x = null;
  try { x = new XMLHttpRequest(); }
  catch (e) {
    try { x = new ActiveXObject("Microsoft.XMLHTTP"); } catch (e2) { cb(0, ""); return; }
  }
  var done = false;
  function finish() {
    if (done) return;
    done = true;
    cb(x.status, x.responseText);
  }
  try {
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4) finish();
    };
    x.send(null);
    /* fallback if onreadystatechange never fires on broken browsers */
    setTimeout(function () {
      if (!done && x.readyState === 4) finish();
    }, 20000);
  } catch (e) {
    cb(0, "");
  }
}

/* ---- AI call: GET endpoint with ?key= => no CORS preflight ---- */
function getAI(question, useWeb, cb) {
  var model = useWeb ? "gemini-search" : "openai";
  var url = "https://gen.pollinations.ai/text/" + encodeURIComponent(question) +
            "?model=" + model +
            "&system=" + encodeURIComponent(SYS) +
            "&key=" + encodeURIComponent(API_KEY);

  xhrGet(url, function (status, text) {
    if (status === 200 && text) {
      var t = text;
      var j = parseJSON(text);
      if (j && j.choices && j.choices[0] && j.choices[0].message) {
        t = j.choices[0].message.content;
      }
      cb(null, t);
      return;
    }
    if (status === 401) { cb("key missing or bad (401)", null); return; }
    if (status === 402) { cb("out of Pollen credit (402)", null); return; }
    if (status === 404) { cb("endpoint not found (404)", null); return; }
    if (status === 429 || status === 503) {
      var w = add('a', "busy, retrying in 8s...");
      setTimeout(function () {
        w.parentNode && w.parentNode.removeChild(w);
        getAI(question, useWeb, cb);
      }, 8000);
      return;
    }
    cb("HTTP " + status + " / no connection", null);
  });
}

/* ---- images (Wikimedia, plain GET, no preflight) ---- */
function addImages(keywords) {
  var list = keywords.split(',');
  var n = 0;

  function next() {
    if (n >= list.length || n >= 2) return;
    var kw = list[n];
    n++;
    kw = kw.replace(/^\s+|\s+$/g, "");
    if (!kw) { next(); return; }
    var url = "https://commons.wikimedia.org/w/api.php?action=query&format=json" +
              "&generator=search&gsrsearch=" + encodeURIComponent("filetype:bitmap " + kw) +
              "&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=70";
    xhrGet(url, function (status, text) {
      if (status === 200 && text) {
        var j = parseJSON(text);
        if (j && j.query && j.query.pages) {
          for (var k in j.query.pages) {
            var p = j.query.pages[k];
            if (p && p.imageinfo && p.imageinfo[0]) {
              var img = document.createElement('img');
              img.className = "img";
              img.src = p.imageinfo[0].thumburl || p.imageinfo[0].url;
              img.alt = kw;
              chat.appendChild(img);
              chat.scrollTop = chat.scrollHeight;
              break;
            }
          }
        }
      }
      setTimeout(next, 300);
    });
  }
  next();
}

/* ---- ask ---- */
function ask() {
  if (busy) return;
  var question = input.value;
  question = question.replace(/^\s+|\s+$/g, "");
  if (!question) return;

  var useWeb = false;
  if (/^web\s+/i.test(question)) {
    useWeb = true;
    question = question.replace(/^web\s+/i, "");
  }
  if (!useWeb && /latest|today|now|current|news|price|weather/i.test(question)) useWeb = true;

  busy = true;
  btn.innerHTML = "..";
  input.value = "";
  add('q', "> " + question + (useWeb ? " [web]" : ""));
  var aEl = add('a', "thinking...");

  getAI(question, useWeb, function (err, text) {
    if (err) {
      aEl.appendChild(document.createTextNode(""));
      aEl.innerHTML = "";
      aEl.appendChild(document.createTextNode("Error: " + err));
      busy = false; btn.innerHTML = "GO";
      return;
    }
    var kw = "";
    var m = text.match(/KEYWORDS:\s*(.+)/i);
    if (m) { kw = m[1]; text = text.replace(m[0], ""); }
    aEl.innerHTML = "";
    aEl.appendChild(document.createTextNode(text));
    chat.scrollTop = chat.scrollHeight;
    busy = false; btn.innerHTML = "GO";
    if (kw) addImages(kw);
  });
}

/* ---- D-pad / keypad keys ----
   keyCode 38=up 40=down 37=left 39=right 13=OK/Enter
   Up/Down scroll chat or move focus, Enter sends.        */
document.onkeydown = function (e) {
  e = e || window.event;
  var k = e.keyCode;
  var el = document.activeElement;

  if (k === 40) {                       /* DOWN */
    if (el === chat) chat.scrollTop += 20;
    return;
  }
  if (k === 38) {                       /* UP */
    if (el === chat) chat.scrollTop -= 20;
    return;
  }
  if (k === 13) {                       /* OK / Enter */
    if (el === input || el === btn) { if (el === btn) ask(); }
    return;
  }
};

document.getElementById('q').onkeypress = function (e) {
  e = e || window.event;
  if (e.keyCode === 13) { ask(); return false; }
  return true;
};
</script>
</body>
</html>
